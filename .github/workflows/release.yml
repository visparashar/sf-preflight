name: Release

on:
  push:
    tags: ["v*.*.*"]
    # Merging a release pull request (one that changes the version in package.json) releases it:
    # the `plan` job below tags the commit, then everything publishes in this same run.
    branches: [main]
    paths: [package.json]
  # Re-run a release by choosing the tag under "Use workflow from".
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  plan:
    name: Decide what to release
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.plan.outputs.release }}
      tag: ${{ steps.plan.outputs.tag }}
    permissions:
      contents: write # create the version tag when a release pull request is merged
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Work out the tag
        id: plan
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          TAG="v$VERSION"
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            # Started from a tag (or re-run for one): release exactly that tag.
            echo "release=true" >> "$GITHUB_OUTPUT"
            echo "tag=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
          elif [ "$GITHUB_EVENT_NAME" = "push" ] && [ "$GITHUB_REF_NAME" = "main" ]; then
            if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
              echo "Tag $TAG already exists: the version did not change, nothing to release."
              echo "release=false" >> "$GITHUB_OUTPUT"
            else
              git tag "$TAG" "$GITHUB_SHA"
              git push origin "refs/tags/$TAG"
              echo "release=true" >> "$GITHUB_OUTPUT"
              echo "tag=$TAG" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "::error::Run the release workflow from a vX.Y.Z tag (Use workflow from → Tags)."
            exit 1
          fi

  publish:
    name: Publish to npm and create GitHub release
    needs: plan
    if: needs.plan.outputs.release == 'true'
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: write # create the GitHub release
      id-token: write # npm provenance / trusted publishing, and signing the release assets
      attestations: write # build provenance for the release tarball
      artifact-metadata: write
    env:
      TAG: ${{ needs.plan.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.tag }}
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org
      - name: Use an npm version that supports trusted publishing
        run: npm install -g npm@latest
      - run: npm ci
      - run: npm run check
      - name: Verify tag matches package.json version
        id: version
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          if [ "v$VERSION" != "$TAG" ]; then
            echo "::error::Tag $TAG does not match package.json version v$VERSION"
            exit 1
          fi
          NAME="$(node -p "require('./package.json').name")"
          if npm view "$NAME@$VERSION" version >/dev/null 2>&1; then
            echo "already_published=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Publish
        if: steps.version.outputs.already_published != 'true'
        run: npm publish --provenance --access public
        env:
          # Leave unset when using npm trusted publishing (OIDC); set it for token-based publishing.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Create GitHub release
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists."
          else
            gh release create "$TAG" --verify-tag --generate-notes
          fi
        env:
          GH_TOKEN: ${{ github.token }}
      # The same package as on npm, attached to the release with a signed provenance bundle, so it can be
      # checked with `gh attestation verify` (and counts as a signed release).
      - name: Pack the release tarball
        id: pack
        run: echo "file=$(npm pack --silent | tail -n 1)" >> "$GITHUB_OUTPUT"
      - name: Sign the tarball (build provenance)
        id: attest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ steps.pack.outputs.file }}
      - name: Attach the tarball and its signature to the release
        run: |
          cp "$BUNDLE" "$FILE.sigstore.json"
          gh release upload "$TAG" "$FILE" "$FILE.sigstore.json" --clobber
        env:
          GH_TOKEN: ${{ github.token }}
          FILE: ${{ steps.pack.outputs.file }}
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
      - name: Move the major version tag for the GitHub Action (e.g. v0)
        run: |
          MAJOR="${TAG%%.*}"
          git tag -f "$MAJOR" "$TAG^{commit}"
          git push -f origin "refs/tags/$MAJOR"

  publish-plugin:
    name: Publish the sf CLI plugin
    # After the CLI is on npm: the plugin depends on this exact release of it.
    needs: [plan, publish]
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write # npm provenance / trusted publishing
    env:
      TAG: ${{ needs.plan.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.tag }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: Use an npm version that supports trusted publishing
        run: npm install -g npm@latest
      - name: Check the plugin has this release's version
        id: version
        working-directory: sf-plugin
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          if [ "v$VERSION" != "$TAG" ]; then
            echo "::error::sf-plugin is at $VERSION but the release is $TAG. Run: node scripts/version.mjs <version>"
            exit 1
          fi
          if npm view "sf-plugin-preflight@$VERSION" version >/dev/null 2>&1; then
            echo "already_published=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Install, build and test against the published CLI
        if: steps.version.outputs.already_published != 'true'
        run: |
          npm ci
          npm run build
          cd sf-plugin
          # The CLI was published moments ago; wait for the registry to serve it.
          ok=0
          for i in 1 2 3 4 5 6; do
            # --prefer-online: a failed lookup must not be served again from npm's cache.
            if npm install --prefer-online; then ok=1; break; fi
            sleep 20
          done
          [ "$ok" = 1 ]
          npm run typecheck
          SF_PREFLIGHT_CLI="$GITHUB_WORKSPACE/dist/cli.js" npm test
      - name: Publish
        if: steps.version.outputs.already_published != 'true'
        working-directory: sf-plugin
        run: npm publish --provenance --access public
        env:
          # Leave unset when using npm trusted publishing (OIDC); set it for token-based publishing.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
