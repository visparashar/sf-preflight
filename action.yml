name: "sf-preflight"
description: "Preflight checks for Salesforce changes: what a PR sets off through flows, triggers etc."
author: "sf-preflight contributors"
branding:
  icon: "crosshair"
  color: "blue"

inputs:
  project:
    description: "SFDX project directory, relative to the repository root."
    default: "."
  base:
    description: "Git base ref. Defaults to the pull request's base branch, or HEAD~1 on push events."
    default: ""
  fail-on:
    description: "Severity that fails the quality gate: low, medium, high or none. Defaults to gate.failOn in .preflight.json, else high."
    default: ""
  config:
    description: "Policy file (rule overrides, ignores, quality gate). Defaults to .preflight.json in the project, then the repository root."
    default: ""
  policy-from-base:
    description: "On pull requests, read the policy from the base branch, so a pull request can't loosen the gate it's checked against. Set to false to use the pull request's own policy."
    default: "true"
  evidence:
    description: "Write the change's evidence pack and upload it as a workflow artifact."
    default: "true"
  artifact-name:
    description: "Name of the evidence artifact (must be unique within the workflow run)."
    default: "sf-preflight-evidence"
  attest:
    description: "Sign the evidence pack with a GitHub artifact attestation. Needs `id-token: write`, `attestations: write` and `artifact-metadata: write`."
    default: "false"
  comment:
    description: "Post (and keep updated) a pull request comment with the report. Needs `pull-requests: write`."
    default: "true"
  suggest-fixes:
    description: "On pull requests, post checked fixes as suggested changes the author can apply with one click. Needs `pull-requests: write`; only fixes that edit lines the pull request changed are suggested."
    default: "false"
  suggest-fix-kinds:
    description: "Which kinds of fix to suggest, comma-separated: safe, undo, review."
    default: "safe,undo"
  sarif:
    description: "Upload findings to GitHub code scanning. Needs `security-events: write`."
    default: "false"
  depth:
    description: "Maximum cascade depth."
    default: "4"
  sfdx-auth-url:
    description: "Optional (beta): SFDX auth URL of a read-only integration user, passed from a secret. Installs the Salesforce CLI if needed, logs in, and adds org context (record counts, automation only in the org, permission set assignments)."
    default: ""
  org:
    description: "Optional (beta): alias of an org already authorized earlier in the job. Ignored when sfdx-auth-url is set."
    default: ""
  version:
    description: "sf-preflight npm version to run. Defaults to the version matching this action's ref. Use `local` to build from the action's source."
    default: ""
  node-version:
    description: "Node.js version to set up (22.13 or newer). Set to an empty string to use the runner's Node."
    default: "22"
  notify-webhook:
    description: "Slack, Microsoft Teams or generic webhook URL (pass a secret). Sends a short alert when risk reaches notify-on."
    required: false
    default: ""
  notify-on:
    description: "Alert threshold: low, medium, high, gate-fail or always"
    required: false
    default: "high"
  notify-on-update:
    description: "Also alert on every push to an open pull request. When false, alerts fire when a pull request is opened, reopened or made ready for review, and on pushes."
    required: false
    default: "false"
  github-token:
    description: "Token used to post the PR comment."
    default: ${{ github.token }}

outputs:
  risk:
    description: "Overall risk: low, medium or high."
    value: ${{ steps.results.outputs.risk }}
  high:
    description: "Number of high-severity findings."
    value: ${{ steps.results.outputs.high }}
  medium:
    description: "Number of medium-severity findings."
    value: ${{ steps.results.outputs.medium }}
  ai-assisted-commits:
    description: "Number of AI-assisted commits detected in the analyzed range."
    value: ${{ steps.results.outputs.ai_assisted_commits }}
  report-markdown:
    description: "Path to the Markdown report."
    value: ${{ steps.analyze.outputs.md }}
  report-json:
    description: "Path to the JSON report."
    value: ${{ steps.analyze.outputs.json }}
  report-sarif:
    description: "Path to the SARIF report."
    value: ${{ steps.analyze.outputs.sarif }}
  gate:
    description: "Quality gate result: pass or fail."
    value: ${{ steps.results.outputs.gate }}
  evidence:
    description: "Path to the evidence pack (JSON), when evidence is enabled."
    value: ${{ steps.analyze.outputs.evidence }}
  evidence-digest:
    description: "SHA-256 digest recorded in the evidence pack."
    value: ${{ steps.results.outputs.evidence_digest }}
  attestation-url:
    description: "URL of the evidence attestation, when attest is enabled."
    value: ${{ steps.attest.outputs.attestation-url }}

runs:
  using: "composite"
  steps:
    - name: Set up Node.js
      if: inputs.node-version != ''
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: ${{ inputs.node-version }}

    - name: Resolve preflight command
      id: cmd
      shell: bash
      env:
        INPUT_VERSION: ${{ inputs.version }}
        ACTION_PATH: ${{ github.action_path }}
      run: |
        set -euo pipefail
        if [ "$INPUT_VERSION" = "local" ]; then
          (cd "$ACTION_PATH" && npm ci --no-audit --no-fund --loglevel=error && npm run build --silent)
          echo "run=node $ACTION_PATH/dist/cli.js" >> "$GITHUB_OUTPUT"
        else
          VERSION="$INPUT_VERSION"
          if [ -z "$VERSION" ]; then
            VERSION="$(node -p "require('$ACTION_PATH/package.json').version")"
          fi
          echo "run=npx --yes sf-preflight@$VERSION" >> "$GITHUB_OUTPUT"
        fi

    - name: Resolve base ref
      id: base
      shell: bash
      env:
        INPUT_BASE: ${{ inputs.base }}
        # Set for pull_request and pull_request_review events alike.
        PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
      run: |
        set -euo pipefail
        BASE="$INPUT_BASE"
        if [ -z "$BASE" ]; then
          if [ -n "${PR_BASE_REF:-}" ]; then
            git fetch --no-tags --quiet origin "+refs/heads/${PR_BASE_REF}:refs/remotes/origin/${PR_BASE_REF}"
            BASE="origin/${PR_BASE_REF}"
          else
            BASE="HEAD~1"
          fi
        fi
        echo "ref=$BASE" >> "$GITHUB_OUTPUT"

    - name: Log in to Salesforce org
      id: org
      if: inputs.sfdx-auth-url != '' || inputs.org != ''
      shell: bash
      env:
        SFDX_AUTH_URL: ${{ inputs.sfdx-auth-url }}
        INPUT_ORG: ${{ inputs.org }}
      run: |
        set -euo pipefail
        if [ -z "$SFDX_AUTH_URL" ]; then
          echo "alias=$INPUT_ORG" >> "$GITHUB_OUTPUT"
          exit 0
        fi
        if ! command -v sf >/dev/null 2>&1; then
          npm install --global @salesforce/cli --no-audit --no-fund --loglevel=error
        fi
        export SF_SKIP_NEW_VERSION_CHECK=true SF_DISABLE_TELEMETRY=true
        # The auth URL is read from stdin so it never reaches the command line or disk.
        if ! out=$(printf '%s' "$SFDX_AUTH_URL" | sf org login sfdx-url --sfdx-url-stdin - --alias sf-preflight-org --json 2>/dev/null); then
          msg=$(printf '%s' "$out" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{console.log(JSON.parse(s).message)}catch{console.log("unknown error")}})')
          echo "::error title=sf-preflight::Salesforce login failed: $msg"
          exit 1
        fi
        echo "alias=sf-preflight-org" >> "$GITHUB_OUTPUT"

    - name: Collect approvals
      id: approvals
      # Approvals of the pull request (or, on push, of the pull request the commit came from).
      continue-on-error: true
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
      env:
        APPROVALS_FILE: ${{ runner.temp }}/sf-preflight-approvals.json
      with:
        github-token: ${{ inputs.github-token }}
        script: |
          const fs = require("node:fs");
          const { owner, repo } = context.repo;
          let pr = context.payload.pull_request;
          let reviews;
          try {
            if (!pr) {
              const { data } = await github.rest.repos.listPullRequestsAssociatedWithCommit({ owner, repo, commit_sha: context.sha });
              pr = data.find((p) => p.merged_at) ?? data[0];
            }
            if (!pr) {
              core.info("No pull request for this commit, so approvals are unknown.");
              return;
            }
            reviews = await github.paginate(github.rest.pulls.listReviews, { owner, repo, pull_number: pr.number, per_page: 100 });
          } catch (err) {
            core.info(`Could not read pull request reviews (${err.message}), so approvals are unknown.`);
            return;
          }
          // Who wrote the change can't approve it: the pull request's author and every commit author.
          const authors = new Set([pr.user.login]);
          try {
            const commits = await github.paginate(github.rest.pulls.listCommits, { owner, repo, pull_number: pr.number, per_page: 100 });
            for (const c of commits) {
              if (c.author?.login) authors.add(c.author.login);
              if (c.committer?.login && c.committer.login !== "web-flow") authors.add(c.committer.login);
            }
          } catch (err) {
            core.info(`Could not list the pull request's commits (${err.message}); only its author is excluded.`);
          }
          // The latest decisive review per reviewer counts; comments don't change it, dismissals do.
          const latest = new Map();
          for (const r of reviews) {
            if (!r.user || r.state === "COMMENTED" || r.state === "PENDING") continue;
            latest.set(r.user.login, r);
          }
          // Approvals of the latest commit by people who didn't write the change and can write to the repository.
          const candidates = [...latest.values()]
            .filter((r) => r.state === "APPROVED")
            .filter((r) => r.user.type !== "Bot")
            .filter((r) => r.commit_id === pr.head.sha)
            .filter((r) => !authors.has(r.user.login));
          const approvals = [];
          for (const r of candidates) {
            let canWrite = false;
            try {
              const { data } = await github.rest.repos.getCollaboratorPermissionLevel({ owner, repo, username: r.user.login });
              canWrite = data.permission === "admin" || data.permission === "write";
            } catch (err) {
              core.info(`Could not check ${r.user.login}'s access (${err.message}); their approval doesn't count.`);
            }
            if (canWrite) approvals.push({ reviewer: r.user.login, submittedAt: r.submitted_at });
          }
          core.info(`${approvals.length} approval(s) count: ${approvals.map((a) => a.reviewer).join(", ") || "none"}.`);
          core.setOutput("pr_number", String(pr.number));
          core.setOutput("pr_head_sha", pr.head.sha);
          core.setOutput("pr_url", pr.html_url);
          fs.writeFileSync(process.env.APPROVALS_FILE, JSON.stringify(approvals));
          core.setOutput("file", process.env.APPROVALS_FILE);

    - name: Analyze
      id: analyze
      shell: bash
      env:
        RUN: ${{ steps.cmd.outputs.run }}
        PROJECT: ${{ inputs.project }}
        BASE: ${{ steps.base.outputs.ref }}
        DEPTH: ${{ inputs.depth }}
        ORG: ${{ steps.org.outputs.alias }}
        FAIL_ON: ${{ inputs.fail-on }}
        CONFIG: ${{ inputs.config }}
        APPROVALS: ${{ steps.approvals.outputs.file }}
        EVIDENCE: ${{ inputs.evidence }}
        POLICY_FROM_BASE: ${{ inputs.policy-from-base }}
        IS_PR: ${{ github.event.pull_request && 'true' || '' }}
        PR_NUMBER: ${{ steps.approvals.outputs.pr_number }}
        PR_HEAD_SHA: ${{ steps.approvals.outputs.pr_head_sha }}
        PR_URL: ${{ steps.approvals.outputs.pr_url }}
      run: |
        set -euo pipefail
        OUT="$RUNNER_TEMP/sf-preflight"
        mkdir -p "$OUT"
        ARGS=()
        if [ "$EVIDENCE" = "true" ]; then ARGS+=(--evidence-out "$OUT/evidence.json"); fi
        # On pull requests the policy comes from the base branch, so the change can't loosen it.
        if [ -n "$IS_PR" ] && [ "$POLICY_FROM_BASE" = "true" ]; then ARGS+=(--config-ref "$BASE"); fi
        if [ -n "$PR_NUMBER" ]; then
          ARGS+=(--pr-number "$PR_NUMBER" --pr-head-sha "$PR_HEAD_SHA" --pr-url "$PR_URL")
        fi
        # Exit code 2 means the gate failed: report first, fail in the last step.
        set +e
        $RUN analyze --project "$PROJECT" --base "$BASE" --depth "$DEPTH" ${ORG:+--org "$ORG"} \
          --gate ${FAIL_ON:+--fail-on "$FAIL_ON"} ${CONFIG:+--config "$CONFIG"} ${APPROVALS:+--approvals "$APPROVALS"} \
          ${ARGS[@]+"${ARGS[@]}"} \
          --format md --out "$OUT/report.md" --json-out "$OUT/report.json" --sarif-out "$OUT/report.sarif"
        code=$?
        set -e
        if [ "$code" -ne 0 ] && [ "$code" -ne 2 ]; then exit "$code"; fi
        {
          echo "md=$OUT/report.md"
          echo "json=$OUT/report.json"
          echo "sarif=$OUT/report.sarif"
          if [ "$EVIDENCE" = "true" ]; then echo "evidence=$OUT/evidence.json"; fi
        } >> "$GITHUB_OUTPUT"
        cat "$OUT/report.md" >> "$GITHUB_STEP_SUMMARY"

    - name: Read results
      id: results
      shell: bash
      env:
        REPORT: ${{ steps.analyze.outputs.json }}
        EVIDENCE: ${{ steps.analyze.outputs.evidence }}
      run: |
        set -euo pipefail
        node -e '
          const r = require(process.env.REPORT);
          const e = process.env.EVIDENCE ? require(process.env.EVIDENCE) : undefined;
          const out = [
            `risk=${r.summary.risk}`,
            `high=${r.summary.findingsBySeverity.high}`,
            `medium=${r.summary.findingsBySeverity.medium}`,
            `ai_assisted_commits=${r.provenance ? r.provenance.aiAssistedCommits : 0}`,
            `gate=${r.gate ? r.gate.status : "fail"}`,
            `evidence_digest=${e ? e.digest.value : ""}`,
          ];
          require("node:fs").appendFileSync(process.env.GITHUB_OUTPUT, out.join("\n") + "\n");
        '

    - name: Upload evidence
      if: inputs.evidence == 'true' && steps.analyze.outputs.evidence != ''
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: ${{ inputs.artifact-name }}
        path: ${{ steps.analyze.outputs.evidence }}
        if-no-files-found: error

    - name: Sign evidence
      id: attest
      # Fork pull requests get no OIDC token, so they can't sign; the rest of the run still reports.
      if: inputs.attest == 'true' && steps.analyze.outputs.evidence != '' && !github.event.pull_request.head.repo.fork
      continue-on-error: true
      uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
      with:
        subject-path: ${{ steps.analyze.outputs.evidence }}
        predicate-type: https://github.com/visparashar/sf-preflight/evidence/v1
        predicate-path: ${{ steps.analyze.outputs.evidence }}

    - name: Warn when the evidence isn't signed
      if: inputs.attest == 'true' && steps.analyze.outputs.evidence != '' && steps.attest.outcome != 'success'
      shell: bash
      run: echo "::warning title=sf-preflight::The evidence pack was not signed (fork pull request, or missing id-token/attestations permissions)."

    - name: Comment on pull request
      if: inputs.comment == 'true' && github.event.pull_request
      # Fork PRs get a read-only token; don't fail the check just because commenting isn't allowed.
      continue-on-error: true
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
      env:
        REPORT: ${{ steps.analyze.outputs.md }}
      with:
        github-token: ${{ inputs.github-token }}
        script: |
          const fs = require("node:fs");
          const marker = "<!-- sf-preflight -->";
          let body = fs.readFileSync(process.env.REPORT, "utf8");
          const limit = 60000;
          if (body.length > limit) body = body.slice(0, limit) + "\n\n_…truncated; see the job summary for the full report._";
          body = `${marker}\n${body}`;
          const { owner, repo } = context.repo;
          const issue_number = context.payload.pull_request.number;
          const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number, per_page: 100 });
          const existing = comments.find((c) => c.body && c.body.startsWith(marker));
          if (existing) {
            await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
          } else {
            await github.rest.issues.createComment({ owner, repo, issue_number, body });
          }

    - name: Suggest fixes on pull request
      if: inputs.suggest-fixes == 'true' && github.event.pull_request
      # Fork PRs get a read-only token; suggestions are a convenience, never a reason to fail.
      continue-on-error: true
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
      env:
        RUN: ${{ steps.cmd.outputs.run }}
        PROJECT: ${{ inputs.project }}
        BASE: ${{ steps.base.outputs.ref }}
        DEPTH: ${{ inputs.depth }}
        CONFIG: ${{ inputs.config }}
        POLICY_FROM_BASE: ${{ inputs.policy-from-base }}
        KINDS: ${{ inputs.suggest-fix-kinds }}
        OUT: ${{ runner.temp }}/sf-preflight/suggestions.json
      with:
        github-token: ${{ inputs.github-token }}
        script: |
          const fs = require("node:fs");
          const { execFileSync } = require("node:child_process");
          const e = process.env;
          const args = ["fix", "--project", e.PROJECT, "--base", e.BASE, "--depth", e.DEPTH, "--kinds", e.KINDS,
            "--suggestions-out", e.OUT, "--format", "json"];
          if (e.CONFIG) args.push("--config", e.CONFIG);
          else if (e.POLICY_FROM_BASE === "true") args.push("--config-ref", e.BASE);
          const [cmd, ...rest] = e.RUN.split(" ");
          execFileSync(cmd, [...rest, ...args], { stdio: ["ignore", "ignore", "inherit"], maxBuffer: 64 * 1024 * 1024 });
          const { suggestions } = JSON.parse(fs.readFileSync(e.OUT, "utf8"));
          if (!suggestions.length) return core.info("No fix can be suggested as a change on this pull request.");

          const { owner, repo } = context.repo;
          const pr = context.payload.pull_request;
          const files = await github.paginate(github.rest.pulls.listFiles, { owner, repo, pull_number: pr.number, per_page: 100 });
          // Line ranges of the new side of each hunk: a suggestion must sit inside one.
          const hunksOf = (patch) => {
            const out = [];
            let cur;
            let line = 0;
            for (const l of (patch ?? "").split("\n")) {
              const h = /^@@ -\d+(?:,\d+)? \+(\d+)(?:,\d+)? @@/.exec(l);
              if (h) {
                cur = { from: Number(h[1]), to: Number(h[1]) - 1 };
                out.push(cur);
                line = Number(h[1]);
              } else if (cur && l !== "" && !l.startsWith("-") && !l.startsWith("\\")) {
                cur.to = line++;
              }
            }
            return out;
          };
          const existing = await github.paginate(github.rest.pulls.listReviewComments, { owner, repo, pull_number: pr.number, per_page: 100 });
          const done = new Set(existing.map((c) => /<!-- sf-preflight-fix:(\w+) -->/.exec(c.body ?? "")?.[1]).filter(Boolean));
          let posted = 0;
          for (const s of suggestions) {
            if (posted >= 10) break;
            if (done.has(s.id)) continue;
            const file = files.find((f) => f.filename === s.path);
            if (!file || !hunksOf(file.patch).some((h) => s.startLine >= h.from && s.endLine <= h.to)) continue;
            // The suggestion replaces lines of the pull request's head; they must still be what was fixed.
            let head;
            try {
              const { data } = await github.rest.repos.getContent({ owner, repo, path: s.path, ref: pr.head.sha });
              head = Buffer.from(data.content, "base64").toString("utf8").split("\n");
            } catch {
              continue;
            }
            if (head.slice(s.startLine - 1, s.endLine).join("\n") !== s.current.join("\n")) continue;
            const body = s.replacement.join("\n");
            const fence = body.includes("```") ? "````" : "```";
            const text = [
              `<!-- sf-preflight-fix:${s.id} -->`,
              `**sf-preflight fix: ${s.label}**`,
              "",
              `Fixes: ${s.finding} (\`${s.rule}\`), checked by analyzing the change again with it applied.`,
              ...(s.kind === "safe" ? [] : [`This ${s.kind === "undo" ? "puts part of the change back as it was" : "needs a read before you accept it"}.`]),
              ...(s.note ? ["", `_${s.note}_`] : []),
              "",
              `${fence}suggestion`,
              ...(body === "" && s.replacement.length === 0 ? [] : [body]),
              fence,
            ].join("\n");
            try {
              await github.rest.pulls.createReviewComment({
                owner, repo, pull_number: pr.number, commit_id: pr.head.sha, path: s.path,
                line: s.endLine, side: "RIGHT",
                ...(s.endLine > s.startLine ? { start_line: s.startLine, start_side: "RIGHT" } : {}),
                body: text,
              });
              posted++;
            } catch (err) {
              core.info(`Could not suggest ${s.id}: ${err.message}`);
            }
          }
          core.info(`${posted} suggested change(s) posted.`);

    - name: Send risk alert
      if: >-
        inputs.notify-webhook != '' && (
        !github.event.pull_request ||
        inputs.notify-on-update == 'true' ||
        github.event.action == 'opened' ||
        github.event.action == 'reopened' ||
        github.event.action == 'ready_for_review')
      # An alert must never fail the check.
      continue-on-error: true
      shell: bash
      env:
        PREFLIGHT_WEBHOOK_URL: ${{ inputs.notify-webhook }}
        RUN: ${{ steps.cmd.outputs.run }}
        REPORT: ${{ steps.analyze.outputs.json }}
        ON: ${{ inputs.notify-on }}
        REPO: ${{ github.repository }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        SERVER: ${{ github.server_url }}
        RUN_ID: ${{ github.run_id }}
      run: |
        set -euo pipefail
        # Only ids and numbers go in the message; never the PR title or branch name.
        if [ -n "$PR_NUMBER" ]; then
          LINK="$SERVER/$REPO/pull/$PR_NUMBER"; SOURCE="$REPO PR #$PR_NUMBER"
        else
          LINK="$SERVER/$REPO/actions/runs/$RUN_ID"; SOURCE="$REPO"
        fi
        $RUN notify --result "$REPORT" --on "$ON" --link "$LINK" --source "$SOURCE"

    - name: Upload SARIF to code scanning
      if: inputs.sarif == 'true'
      uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
      with:
        sarif_file: ${{ steps.analyze.outputs.sarif }}
        category: sf-preflight

    - name: Log out of Salesforce org
      if: always() && inputs.sfdx-auth-url != ''
      shell: bash
      run: sf org logout --target-org sf-preflight-org --no-prompt --json >/dev/null 2>&1 || true

    - name: Apply quality gate
      shell: bash
      env:
        GATE: ${{ steps.results.outputs.gate }}
        RISK: ${{ steps.results.outputs.risk }}
      run: |
        set -euo pipefail
        if [ "$GATE" = "fail" ]; then
          echo "::error title=sf-preflight::Quality gate failed (risk: $RISK). See the job summary for the checks."
          exit 1
        fi
        echo "sf-preflight quality gate: passed (risk: $RISK)"
